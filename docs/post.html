<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>帖子詳情｜香港火災後交流論壇</title>
</head>
<body>
    <!-- Site header -->
    <header>
        <h1>帖子詳情</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">首頁</a>
            <a href="posts.html">瀏覽帖子</a>
            <a href="create.html">發布帖子</a>
            <a href="register.html">建立帳號</a>
            <a href="login.html">登入</a>
            <a href="profile.html">個人主頁</a>
        </nav>
    </header>

    <!-- Main page content -->
    <main>
        <!-- Full post content -->
        <article>
            <h2>需要臨時住宿協助</h2>
            <p>分類：臨時安置</p>
            <p>發布時間：2026年9月23日</p>
            <p>我們一家三口需要兩晚的臨時住宿。如有相關資訊，請在下方留言。</p>
        </article>

        <!-- Reply list -->
        <section>
            <h2>回覆</h2>
            <article>
                <h3>社區義工</h3>
                <p>附近的社區中心目前提供臨時休息位置，可以先致電查詢。</p>
            </article>
        </section>

        <!-- Reply form -->
        <section>
            <h2>新增回覆</h2>
            <form action="#" method="post">
                <p>
                    <label for="reply-name">名稱：</label>
                    <input type="text" id="reply-name" name="reply-name" required>
                </p>
                <p>
                    <label for="reply-content">回覆內容：</label><br>
                    <textarea id="reply-content" name="reply-content" rows="5" required></textarea>
                </p>
                <button type="submit">提交回覆</button>
            </form>
        </section>
    </main>

    <!-- Site footer -->
    <footer>
        <p><a href="posts.html">返回帖子列表</a></p>
    </footer>

    <!-- AI assistant widget -->
    <button id="ai-trigger" type="button" aria-label="打開 AI 助手" aria-controls="ai-panel" aria-expanded="false">✨</button>

    <section id="ai-panel" aria-label="AI 助手" hidden>
        <header>
            <strong>AI 助手</strong>
            <button id="ai-close" type="button" aria-label="關閉 AI 助手">×</button>
        </header>

        <div id="ai-messages" aria-live="polite">
            <div class="ai-message">你好，需要甚麼幫助？</div>
        </div>

        <form id="ai-form">
            <label for="ai-input">輸入問題</label>
            <input id="ai-input" name="message" type="text" placeholder="輸入問題…" autocomplete="off" required>
            <button type="submit">發送</button>
        </form>
    </section>
</body>
</html>
