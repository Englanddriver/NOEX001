<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>個人主頁｜香港火災後交流論壇</title>
</head>
<body>
    <!-- Site header -->
    <header>
        <h1>個人主頁</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">首頁</a>
            <a href="posts.html">瀏覽帖子</a>
            <a href="create.html">發布帖子</a>
            <a href="register.html">建立帳號</a>
            <a href="login.html">登入</a>
            <a href="profile.html">個人主頁</a>
        </nav>
    </header>

    <!-- Main page content -->
    <main>
        <!-- User information -->
        <section>
            <h2>帳號資料</h2>
            <p>使用者名稱：社區義工</p>
            <p>加入日期：2026年9月23日</p>
            <p>個人簡介：願意協助整理及分享社區支援資訊。</p>
        </section>

        <!-- User activity summary -->
        <section>
            <h2>活動紀錄</h2>
            <ul>
                <li>已發布帖子：1</li>
                <li>已作出回覆：3</li>
            </ul>
        </section>

        <!-- User post list -->
        <section>
            <h2>我的帖子</h2>
            <article>
                <h3><a href="post.html">社區物資領取資訊</a></h3>
                <p>分類：物資互助</p>
            </article>
        </section>
    </main>

    <!-- Site footer -->
    <footer>
        <p><a href="create.html">發布新帖子</a></p>
    </footer>

    <!-- AI assistant widget -->
    <button id="ai-trigger" type="button" aria-label="打開 AI 助手" aria-controls="ai-panel" aria-expanded="false">✨</button>

    <section id="ai-panel" aria-label="AI 助手" hidden>
        <header>
            <strong>AI 助手</strong>
            <button id="ai-close" type="button" aria-label="關閉 AI 助手">×</button>
        </header>

        <div id="ai-messages" aria-live="polite">
            <div class="ai-message">你好，需要甚麼幫助？</div>
        </div>

        <form id="ai-form">
            <label for="ai-input">輸入問題</label>
            <input id="ai-input" name="message" type="text" placeholder="輸入問題…" autocomplete="off" required>
            <button type="submit">發送</button>
        </form>
    </section>
</body>
</html>
