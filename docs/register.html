<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>建立帳號｜香港火災後交流論壇</title>
</head>
<body>
    <!-- Site header -->
    <header>
        <h1>建立帳號</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">首頁</a>
            <a href="posts.html">瀏覽帖子</a>
            <a href="create.html">發布帖子</a>
            <a href="register.html">建立帳號</a>
            <a href="login.html">登入</a>
            <a href="profile.html">個人主頁</a>
        </nav>
    </header>

    <!-- Main page content -->
    <main>
        <!-- Account registration form -->
        <form action="#" method="post">
            <p>
                <label for="username">使用者名稱：</label>
                <input type="text" id="username" name="username" required>
            </p>

            <p>
                <label for="email">電郵地址：</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">密碼：</label>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label for="confirm-password">確認密碼：</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </p>

            <p>
                <label>
                    <input type="checkbox" name="privacy-agreement" required>
                    我同意遵守論壇規則及私隱政策
                </label>
            </p>

            <button type="submit">建立帳號</button>
        </form>

        <!-- Link for existing users -->
        <p>已有帳號？<a href="login.html">前往登入</a></p>
    </main>

    <!-- Site footer -->
    <footer>
        <p>請勿使用容易被猜中的密碼。</p>
    </footer>

    <!-- AI assistant widget -->
    <button id="ai-trigger" type="button" aria-label="打開 AI 助手" aria-controls="ai-panel" aria-expanded="false">✨</button>

    <section id="ai-panel" aria-label="AI 助手" hidden>
        <header>
            <strong>AI 助手</strong>
            <button id="ai-close" type="button" aria-label="關閉 AI 助手">×</button>
        </header>

        <div id="ai-messages" aria-live="polite">
            <div class="ai-message">你好，需要甚麼幫助？</div>
        </div>

        <form id="ai-form">
            <label for="ai-input">輸入問題</label>
            <input id="ai-input" name="message" type="text" placeholder="輸入問題…" autocomplete="off" required>
            <button type="submit">發送</button>
        </form>
    </section>
</body>
</html>
