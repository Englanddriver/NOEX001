<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入｜香港火災後交流論壇</title>
</head>
<body>
    <!-- Site header -->
    <header>
        <h1>登入</h1>

        <!-- Main navigation -->
        <nav>
            <a href="index.html">首頁</a>
            <a href="posts.html">瀏覽帖子</a>
            <a href="create.html">發布帖子</a>
            <a href="register.html">建立帳號</a>
            <a href="login.html">登入</a>
            <a href="profile.html">個人主頁</a>
        </nav>
    </header>

    <!-- Main page content -->
    <main>
        <!-- Login form -->
        <form action="#" method="post">
            <p>
                <label for="email">電郵地址：</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">密碼：</label>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label>
                    <input type="checkbox" name="remember-me">
                    記住我
                </label>
            </p>

            <button type="submit">登入</button>
        </form>

        <!-- Account help links -->
        <p><a href="#">忘記密碼？</a></p>
        <p>尚未有帳號？<a href="register.html">立即建立帳號</a></p>
    </main>

    <!-- Site footer -->
    <footer>
        <p>請勿在公共電腦上儲存登入資料。</p>
    </footer>
</body>
</html>
